name: Project Intake Routing Demo

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run routing demo in dry-run mode
        working-directory: demos/project-intake-routing
        run: python route_requests.py
